# Included in every location: nginx drops inherited add_header directives as soon as a
# location declares its own, so headers live here instead of at server level.
#
# The app is fully client-side: map tiles (Google, Mapbox, Bing, Esri, OpenStreetMap), building
# outlines (Overpass) and address search (Nominatim) are fetched from the browser over HTTPS.
# Scripts are restricted to this origin; Leaflet and Angular component styles are inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# When served behind TLS, also enable:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
