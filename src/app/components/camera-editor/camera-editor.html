<div class="p-4 border-t border-gray-700">
  <h3 class="text-sm font-semibold mb-3">Edit Camera</h3>

  <label class="block mb-3">
    <span class="text-xs text-gray-400">Name</span>
    <input
      type="text"
      [value]="camera().name"
      (change)="updateName($event)"
      class="w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm mt-1"
    />
  </label>

  <label class="block mb-3">
    <span class="text-xs text-gray-400"
      >Heading: {{ camera().heading }}&deg;</span
    >
    <input
      type="range"
      min="0"
      max="360"
      step="1"
      [value]="camera().heading"
      (input)="updateHeading($event)"
      class="w-full mt-1"
    />
  </label>

  <label class="block mb-3">
    <span class="text-xs text-gray-400">FOV: {{ camera().fov }}&deg;</span>
    <input
      type="range"
      min="10"
      max="180"
      step="1"
      [value]="camera().fov"
      (input)="updateFov($event)"
      class="w-full mt-1"
    />
  </label>

  <label class="block mb-3">
    <span class="text-xs text-gray-400">Range: {{ camera().range }}m</span>
    <input
      type="range"
      min="5"
      max="500"
      step="5"
      [value]="camera().range"
      (input)="updateRange($event)"
      class="w-full mt-1"
    />
  </label>
</div>
