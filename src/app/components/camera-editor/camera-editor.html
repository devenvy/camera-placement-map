<div class="px-4 py-3 border-t border-gray-700">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400">
      Edit Camera
    </h3>
    <button
      (click)="cloneCamera()"
      class="text-xs px-2 py-0.5 bg-gray-700 hover:bg-gray-600 rounded transition-colors"
    >
      Clone
    </button>
  </div>

  <div class="mb-3">
    <span class="text-xs text-gray-500">Name</span>
    <input
      type="text"
      [value]="camera().name"
      (change)="updateName($event)"
      class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm mt-0.5 focus:border-sky-500 focus:outline-none"
    />
  </div>

  <div class="mb-2.5">
    <div class="flex items-baseline justify-between mb-1">
      <span class="text-xs text-gray-500">Heading</span>
      <div class="flex items-baseline gap-0.5">
        <input
          type="number"
          min="0"
          max="360"
          step="1"
          [value]="camera().heading"
          (change)="updateHeading($event)"
          class="w-12 bg-gray-800 border border-gray-700 rounded px-1 py-0.5 text-xs text-right focus:border-sky-500 focus:outline-none"
        />
        <span class="text-xs text-gray-500">&deg;</span>
      </div>
    </div>
    <input
      type="range"
      min="0"
      max="360"
      step="1"
      [value]="camera().heading"
      (input)="updateHeading($event)"
      class="w-full"
    />
  </div>

  <div class="mb-2.5">
    <div class="flex items-baseline justify-between mb-1">
      <span class="text-xs text-gray-500">FOV</span>
      <div class="flex items-baseline gap-0.5">
        <input
          type="number"
          min="10"
          max="180"
          step="1"
          [value]="camera().fov"
          (change)="updateFov($event)"
          class="w-12 bg-gray-800 border border-gray-700 rounded px-1 py-0.5 text-xs text-right focus:border-sky-500 focus:outline-none"
        />
        <span class="text-xs text-gray-500">&deg;</span>
      </div>
    </div>
    <input
      type="range"
      min="10"
      max="180"
      step="1"
      [value]="camera().fov"
      (input)="updateFov($event)"
      class="w-full"
    />
  </div>

  <div class="mb-1">
    <div class="flex items-baseline justify-between mb-1">
      <span class="text-xs text-gray-500">Range</span>
      <div class="flex items-baseline gap-0.5">
        <input
          type="number"
          min="5"
          max="500"
          step="5"
          [value]="camera().range"
          (change)="updateRange($event)"
          class="w-12 bg-gray-800 border border-gray-700 rounded px-1 py-0.5 text-xs text-right focus:border-sky-500 focus:outline-none"
        />
        <span class="text-xs text-gray-500">m</span>
      </div>
    </div>
    <input
      type="range"
      min="5"
      max="500"
      step="5"
      [value]="camera().range"
      (input)="updateRange($event)"
      class="w-full"
    />
  </div>
</div>
